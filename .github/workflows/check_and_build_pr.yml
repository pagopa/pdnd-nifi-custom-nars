name: PR - Check and Build
on:
  pull_request: # Trigger pipeline on PR activity

jobs:
  compute_diff:
    name: Compute diff on folders
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get changed folders
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          matrix: true
          quotepath: false
          files_ignore: .github/**
      - name: Filter directories
        id: filter-dirs
        shell: bash
        env: 
          changed_libs: "${{ steps.changed-files.outputs.all_changed_files }}"
        run: |
            echo $changed_libs
    outputs:
      changed_dirs: ${{ steps.changed-files.outputs.all_changed_files }}
            
  find-modules:
    name: Find Modules
    if: ${{ needs.compute_diff.outputs.changed_dirs != '[]' }}
    runs-on: ubuntu-24.04
    needs: 
      - compute_diff
    timeout-minutes: 5
    outputs:
      folders: ${{ steps.modules.outputs.folders }}
    strategy:
      matrix: 
        dir: ${{ fromJSON(needs.compute_diff.outputs.changed_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List Sub-Folders
        id: modules
        uses: kmanimaran/list-folder-action@6d9f96e7d8cfa8273c443f939f703c5190dbd2c8 # v4
        with:
          path: ${{ matrix.dir }}
      - name: finded modules
        shell: bash
        run: |
            echo ${{ steps.modules.outputs.folders }}

  build:
    name: Build
    if: ${{ needs.compute_diff.outputs.changed_dirs != '[]' }}
    runs-on: ubuntu-24.04
    needs: 
      - compute_diff
      - find-modules
    timeout-minutes: 30
    strategy:
      matrix: 
        dir: ${{ fromJSON(needs.compute_diff.outputs.changed_dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Cache Maven packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build with Maven
      run: mvn clean install
